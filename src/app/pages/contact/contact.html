<section class="page-head">
  <div class="container">
    <div class="kicker">{{ t().navContact }}</div>
    <h1>{{ t().contactPageTitle }}</h1>
    <p>{{ t().contactPageText }}</p>
  </div>
</section>

<section class="page-body">
  <div class="container grid">
    <div class="form-col">
      <app-contact-form variant="full" />
    </div>

    <div class="side-col">
      <div class="card">
        <h2>{{ t().directTitle }}</h2>
        <div class="rows">
          @for (row of t().contactRows; track row.k) {
            <div class="row">
              <span class="k">{{ row.k }}</span>
              @if (row.href) {
                <a [href]="row.href" target="_blank" rel="noopener">{{ row.v }}</a>
              } @else {
                <span class="v">{{ row.v }}</span>
              }
            </div>
          }
        </div>
      </div>
      <div class="card outline">
        <h2>{{ t().availTitle }}</h2>
        <p>{{ t().availText }}</p>
        <div class="badge">
          <span class="dot"></span>
          <span>{{ t().availBadge }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
